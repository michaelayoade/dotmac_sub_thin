name: image

# Build/push only. Deployment stays behind the Foundation/Control gates;
# this workflow emits a bound descriptor copy as an artifact for review
# and never commits or deploys anything.
on:
  workflow_dispatch:

permissions:
  contents: read
  packages: write

concurrency:
  group: image-${{ github.ref }}
  cancel-in-progress: false

env:
  IMAGE: ghcr.io/michaelayoade/dotmac_sub_thin

jobs:
  test-and-build:
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4

      - uses: astral-sh/setup-uv@d4b2f3b6ecc6e67c4457f6d3e41ec42d3d0fcb86 # v5

      - name: Test
        env:
          UV_INDEX_FORGEJO_USERNAME: ci-reader
          UV_INDEX_FORGEJO_PASSWORD: ${{ secrets.FORGEJO_READ_TOKEN }}
        run: |
          uv sync --extra test
          uv run pytest -q
          uv run python scripts/product_manifest.py check

      - uses: docker/setup-buildx-action@8d2750c68a42422c14e847fe6c8ac0403b4cbd6f # v3

      - uses: docker/login-action@c94ce9fb468520275223c153574b00df6fe4bcc9 # v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - id: build
        uses: docker/build-push-action@10e90e3645eae34f1e60eeb005ba3a3d33f178e8 # v6
        with:
          context: .
          push: true
          tags: ${{ env.IMAGE }}:${{ github.sha }}
          secrets: |
            forgejo_username=ci-reader
            forgejo_password=${{ secrets.FORGEJO_READ_TOKEN }}

      - name: Produce bound descriptor copy
        run: |
          mkdir -p binding
          cp deploy/product.toml binding/product.toml
          python3 scripts/bind_image.py \
            --descriptor binding/product.toml \
            --image "${IMAGE}@${{ steps.build.outputs.digest }}" \
            --source-revision "${GITHUB_SHA}"
          printf '{"image":"%s@%s","source_revision":"%s"}\n' \
            "$IMAGE" "${{ steps.build.outputs.digest }}" "$GITHUB_SHA" \
            > binding/binding.json

      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: image-binding-${{ github.sha }}
          path: binding/
          if-no-files-found: error
