name: image

# Build/push only. Deployment stays behind the Foundation/Control gates;
# this workflow emits a bound descriptor copy as an artifact for review
# and never commits or deploys anything.
on:
  workflow_dispatch:

permissions:
  contents: read
  packages: write

concurrency:
  group: image-${{ github.ref }}
  cancel-in-progress: false

env:
  IMAGE: ghcr.io/michaelayoade/dotmac_sub_thin
  UV_INDEX_FORGEJO_USERNAME: ${{ secrets.UV_INDEX_FORGEJO_USERNAME }}
  UV_INDEX_FORGEJO_PASSWORD: ${{ secrets.UV_INDEX_FORGEJO_PASSWORD }}

jobs:
  test-and-build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: astral-sh/setup-uv@v5

      - name: Test
        run: |
          uv sync --extra test
          uv run pytest -q
          uv run python scripts/product_manifest.py check

      - uses: docker/setup-buildx-action@v3

      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - id: build
        uses: docker/build-push-action@v6
        with:
          context: .
          push: true
          tags: ${{ env.IMAGE }}:${{ github.sha }}
          secrets: |
            forgejo_username=${{ secrets.UV_INDEX_FORGEJO_USERNAME }}
            forgejo_password=${{ secrets.UV_INDEX_FORGEJO_PASSWORD }}

      - name: Produce bound descriptor copy
        run: |
          mkdir -p binding
          cp deploy/product.toml binding/product.toml
          python3 scripts/bind_image.py \
            --descriptor binding/product.toml \
            --image "${IMAGE}@${{ steps.build.outputs.digest }}" \
            --source-revision "${GITHUB_SHA}"
          printf '{"image":"%s@%s","source_revision":"%s"}\n' \
            "$IMAGE" "${{ steps.build.outputs.digest }}" "$GITHUB_SHA" \
            > binding/binding.json

      - uses: actions/upload-artifact@v4
        with:
          name: image-binding-${{ github.sha }}
          path: binding/
          if-no-files-found: error
