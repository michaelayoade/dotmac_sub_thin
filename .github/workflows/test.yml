name: test

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false

      - uses: astral-sh/setup-uv@d4b2f3b6ecc6e67c4457f6d3e41ec42d3d0fcb86 # v5

      # The private package index needs the read-only token; it is scoped to
      # this install step only and is not present when tests run.
      - name: Install
        env:
          UV_INDEX_FORGEJO_USERNAME: ci-reader
          UV_INDEX_FORGEJO_PASSWORD: ${{ secrets.FORGEJO_READ_TOKEN }}
        run: uv sync --extra test --frozen

      - name: Test
        run: uv run pytest -q
